name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key
      SUPABASE_SECRET_KEY: ci-placeholder-server-secret-key
      DATABASE_URL: postgres://ci:ci@127.0.0.1:54322/ci
      OWNER_EMAIL: ci-owner@firstseen.local
      RATE_LIMIT_SALT: ci-placeholder-rate-limit-salt
      INNGEST_EVENT_KEY: ci-placeholder
      INNGEST_SIGNING_KEY: ci-placeholder
      OPENAI_API_KEY: ci-placeholder-openai-project-key
      OPENAI_MODEL: gpt-5.6-luna
      BRAVE_SEARCH_API_KEY: ci-placeholder-brave-key
      ADZUNA_APP_ID: ci-placeholder
      ADZUNA_APP_KEY: ci-placeholder
      SLACK_WEBHOOK_URL: https://hooks.slack.com/services/ci/placeholder/value
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
